# Edit-mode API for alecagayan.com (see server/README.md).
# Included from the site's <VirtualHost> blocks; needs mod_proxy and mod_proxy_http.

ProxyPass        /api/ http://127.0.0.1:8787/api/
ProxyPassReverse /api/ http://127.0.0.1:8787/api/

<Location /api/>
    # Screenshot uploads are capped at 15 MB by the service; leave a little headroom
    LimitRequestBody 16777216
</Location>

# The service's own source code is never served
<Directory /var/www/alecagayan.com/server>
    Require all denied
</Directory>
